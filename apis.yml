aid: payscale
name: PayScale
description: >-
  PayScale is a compensation intelligence and salary data company that helps
  organizations and individuals price jobs, benchmark pay, and manage
  compensation. Its platform combines a Peer Data Ecosystem of daily-refreshed,
  HRIS-sourced salary data across thousands of organizations and millions of
  employee records with survey-based and crowdsourced pay data spanning tens of
  thousands of jobs across many countries. Products include the Payscale Ascent
  compensation management platform, market pricing and benchmarking datasets
  (Peer Global, Peer Enhanced, Peer Industry, Peer Markets), pay equity
  analytics, and consumer-facing salary research tools. This profile was
  surfaced as a VC-portfolio lead and enriched by the API Evangelist pipeline;
  PayScale publishes no public developer API, developer portal, or SDKs at this
  time, so this entry captures company identity, links, and domain-security
  posture rather than an API surface.
